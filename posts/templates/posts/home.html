<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    {% if posts %}
        <h1>All the posts are available</h1>
        { % for post in posts %}
            <a href="{% url 'post' post.id % } "><h1>{{ post.title }}</h1></a>
            <p>{{ post.content }}</p>
        {% endfor %}
    {% elif %}
        <h1>No posts are available</h1>
    {% endif %}
    

</body>
</html>
